services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ggb
      POSTGRES_PASSWORD: ggb
      POSTGRES_DB: ggb
    ports:
      - "5432:5432"
    volumes:
      - ggb_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ggb_redis_data:/data

volumes:
  ggb_postgres_data:
  ggb_redis_data:
